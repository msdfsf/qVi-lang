<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Hash Optimizer</title>
    <style>
        :root {
            --bg-deep: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #010409;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.2);
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --border: #30363d;
            --success: #3fb950;
            --success-bg: rgba(63, 185, 80, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .wrapper { width: 100%; max-width: 1000px; }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.5px; color: var(--accent); }
        p { color: var(--text-dim); margin: 8px 0 0 0; font-size: 14px; }

        /* Configuration Grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: var(--bg-surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .field-group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }

        textarea, input, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px 12px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
        }

        textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        textarea { width: 100%; height: 100px; resize: vertical; margin-bottom: 20px; }

        button#genBtn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button#genBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button#genBtn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

        /* Results Area */
        #stats {
            background: var(--success-bg);
            border: 1px solid var(--success);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            color: var(--success);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .terminal {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .terminal-header {
            background: rgba(255,255,255,0.05);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .terminal-header span { font-size: 11px; font-weight: 600; color: var(--text-dim); font-family: monospace; }

        .copy-btn {
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-weight: 600;
        }

        .copy-btn:hover { background: var(--accent-glow); }

        pre {
            margin: 0;
            padding: 20px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
            overflow-x: auto;
            min-height: 200px;
            color: #d1d5db;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Keyword Table Generator</h1>
        <p>Generates minimal collision-free hash table for language keywords.</p>
    </header>

    <div class="field-group">
        <label>Input Keywords (prefix directives with @)</label>
        <textarea id="keywordsInput" spellcheck="false">void, i8, i16, i32, i64, u8, u16, u32, u64, f32, f64, const, embed, fluid, struct, union, if, else, loop, when, case, enum, return, continue, break, using, alloc, free, error, catch, import, from, as, at, true, false, null, @test</textarea>
    </div>

    <div class="config-grid">
        <div class="field-group">
            <label>Keyword Table Size</label>
            <input type="number" id="kwTableSize" value="51" min="1">
        </div>
        <div class="field-group">
            <label>Directive Table Size</label>
            <input type="number" id="cdTableSize" value="2" min="1">
        </div>
        <div class="field-group">
            <label>Max Iterations</label>
            <input type="number" id="maxIterations" value="10000" min="1">
        </div>
        <div class="field-group" style="display: none">
            <label>Output Prefix</label>
            <input type="text" id="enumPrefixInput" value="KW">
        </div>
    </div>

    <button id="genBtn" onclick="runOptimization()">Optimize Lookup Table</button>

    <div id="stats"></div>

    <div class="terminal">
        <div class="terminal-header">
            <span>KEYWORD_HASH_TABLE.H</span>
            <a href="javascript:void(0)" class="copy-btn" onclick="copyCode()">Copy Code</a>
        </div>
        <pre id="output">// Optimizer idle. Enter keywords and run...</pre>
    </div>
</div>

<script>
    const KW_HASH_SEED = 0x558355AF;
    const CD_HASH_SEED = 0x558355AF;
    const FNV_OFFSET_BASIS = 0x811C9DC5;
    const FNV_PRIME = 0x01000193;

    function fnv1a(str, seed) {
        let h = FNV_OFFSET_BASIS ^ seed;
        for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, FNV_PRIME);
        }
        return h >>> 0;
    }

    function findTable(keywords, size, seed) {
        const table = Array(size).fill(-1);
        for (let k = 0; k < keywords.length; k++) {
            const h = fnv1a(keywords[k], seed) % size;
            if (table[h] !== -1) return null;
            table[h] = k;
        }
        return table;
    }

    function findDirectiveTable(directives, size, seed) {
        const table = Array(size).fill(-1);
        for (let k = 0; k < directives.length; k++) {
            const h = (fnv1a(directives[k], seed) % size) + 1;
            if (h >= size) return null;
            if (table[h] !== -1) return null;
            table[h] = k;
        }
        return table;
    }

    function getCppHashFns() {
        return `uint32_t kwHash(const char* str, int len) {
    uint32_t h = 0x811C9DC5 ^ 0x558355AF;
    int idx = 0;
    while (idx < len) {
        h ^= (uint8_t)str[idx++];
        h *= 0x01000193;
    }
    return h;
}

uint32_t cdHash(const char* str, int len) {
    uint32_t h = 0x811C9DC5 ^ 0x558355AF;
    int idx = 0;
    while (idx < len) {
        h ^= (uint8_t)str[idx++];
        h *= 0x01000193;
    }
    return h;
}`;
    }

    async function runOptimization() {
        const btn = document.getElementById('genBtn');
        const output = document.getElementById('output');
        const stats = document.getElementById('stats');
        const raw = document.getElementById('keywordsInput').value;
        const allTokens = [...new Set(raw.split(/[,\s]+/).map(s => s.trim()).filter(s => s.length > 0))];
        const keywords = allTokens.filter(t => !t.startsWith('@'));
        const directives = allTokens.filter(t => t.startsWith('@')).map(d => d.slice(1));
        const kwTableSize = parseInt(document.getElementById('kwTableSize').value);
        const cdTableSize = parseInt(document.getElementById('cdTableSize').value);
        const maxIterations = parseInt(document.getElementById('maxIterations').value);

        btn.disabled = true;
        output.textContent = "// Searching for minimal perfect hash...";
        stats.style.display = "none";

        await new Promise(r => setTimeout(r, 60));

        let kwTable = null;
        let cdTable = null;

        for (let attempt = 0; attempt < maxIterations; attempt++) {
            const seed = (attempt === 0) ? KW_HASH_SEED : (Math.random() * 0xFFFFFFFF) >>> 0;
            kwTable = findTable(keywords, kwTableSize, seed);
            if (kwTable) break;
        }

        for (let attempt = 0; attempt < maxIterations; attempt++) {
            const seed = (attempt === 0) ? CD_HASH_SEED : (Math.random() * 0xFFFFFFFF) >>> 0;
            cdTable = findDirectiveTable(directives, cdTableSize, seed);
            if (cdTable) break;
        }

        if (!kwTable || !cdTable) {
            output.textContent = "// Error: Could not find collision-free tables.";
            btn.disabled = false;
            return;
        }

        const prefix = document.getElementById('enumPrefixInput').value;
        let code = '';

        code += `enum Keyword : int32_t {\n`;
        keywords.forEach((kw, i) => code += `    ${prefix}_${kw.toUpperCase().padEnd(12)}= ${i},\n`);
        code += `    ${prefix}_COUNT\n};\n\n`;

        code += `enum Directive : int32_t {\n`;
        directives.forEach((dir, i) => code += `    CD_${dir.toUpperCase().padEnd(12)}= ${i},\n`);
        code += `    CD_COUNT\n};\n\n`;

        keywords.forEach(kw => code += `const char* ${prefix}S_${kw.toUpperCase().padEnd(12)}= "${kw}";\n`);
        directives.forEach(dir => code += `const char* CDS_${dir.toUpperCase().padEnd(12)}= "${dir}";\n`);
        code += `\nconst char* keywordStringTable[KW_COUNT] = {\n`;
        keywords.forEach(kw => code += `    ${prefix}S_${kw.toUpperCase()},\n`);
        code += `};\n\n`;
        code += `const char* directiveStringTable[CD_COUNT] = {\n`;
        directives.forEach(dir => code += `    CDS_${dir.toUpperCase()},\n`);
        code += `};\n\n`;
        code += `constexpr int KW_TABLE_SIZE = ${kwTableSize};\n`;
        code += `constexpr std::array<int, KW_TABLE_SIZE> makeKeywordTable() {\n`;
        code += `    std::array<int, KW_TABLE_SIZE> table = {};\n\n`;
        kwTable.forEach((idx, i) => {
            if (idx !== -1) code += `    table[${String(i).padStart(2)}] = ${prefix}_${keywords[idx].toUpperCase().padEnd(12)};\n`;
        });
        code += `\n    return table;\n}\n\n`;
        code += `constexpr auto keywordTable = makeKeywordTable();\n\n`;
        code += `constexpr int CD_TABLE_SIZE = ${cdTableSize};\n`;
        code += `constexpr std::array<int, CD_TABLE_SIZE> makeDirectiveTable() {\n`;
        code += `    std::array<int, CD_TABLE_SIZE> table = {};\n\n`;
        cdTable.forEach((idx, i) => {
            if (idx !== -1) code += `    table[${String(i).padStart(2)}] = CD_${directives[idx].toUpperCase().padEnd(12)};\n`;
        });
        code += `\n    return table;\n}\n\n`;
        code += `constexpr auto directiveTable = makeDirectiveTable();\n\n`;
        code += getCppHashFns();

        output.textContent = code;
        stats.style.display = "block";
        stats.innerHTML = `✓ Keywords: <strong>${keywords.length}</strong> | Directives: <strong>${directives.length}</strong> | KW Table: <strong>${kwTableSize}</strong> | CD Table: <strong>${cdTableSize}</strong> | Seed: <strong>0x558355AF</strong>`;
        btn.disabled = false;
    }

    function copyCode() {
        const text = document.getElementById('output').textContent;
        navigator.clipboard.writeText(text);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy Code", 2000);
    }
</script>

</body>
</html>
