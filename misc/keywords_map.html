<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Hash Optimizer</title>
    <style>
        :root {
            --bg-deep: #0d1117;
            --bg-surface: #161b22;
            --bg-input: #010409;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.2);
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --border: #30363d;
            --success: #3fb950;
            --success-bg: rgba(63, 185, 80, 0.1);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.5;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .wrapper { width: 100%; max-width: 1000px; }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: -0.5px; color: var(--accent); }
        p { color: var(--text-dim); margin: 8px 0 0 0; font-size: 14px; }

        /* Configuration Grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: var(--bg-surface);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .field-group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }

        textarea, input, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            padding: 10px 12px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
        }

        textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        textarea { width: 100%; height: 100px; resize: vertical; margin-bottom: 20px; }

        button#genBtn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button#genBtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        button#genBtn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

        /* Results Area */
        #stats {
            background: var(--success-bg);
            border: 1px solid var(--success);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            color: var(--success);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .terminal {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .terminal-header {
            background: rgba(255,255,255,0.05);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .terminal-header span { font-size: 11px; font-weight: 600; color: var(--text-dim); font-family: monospace; }

        .copy-btn {
            font-size: 11px;
            color: var(--accent);
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-weight: 600;
        }

        .copy-btn:hover { background: var(--accent-glow); }

        pre {
            margin: 0;
            padding: 20px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 13px;
            overflow-x: auto;
            min-height: 200px;
            color: #d1d5db;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Keyword Table Generator</h1>
        <p>Generates minimal collision-free hash table for language keywords.</p>
    </header>

    <div class="field-group">
        <label>Input Keywords</label>
        <textarea id="keywordsInput" spellcheck="false">void, int, i8, i16, i32, i64, u8, u16, u32, u64, f32, f64, const, embed, muton, auton, fcn, def, struct, union, if, else, while, loop, when, case, goto, enum, return, continue, break, using, scope, namespace, alloc, free, error, catch, import, from, true, false, as, by, null</textarea>
    </div>

    <div class="config-grid">
        <div class="field-group">
            <label>Algorithm</label>
            <select id="hashInput">
                <option value="AUTO">Smallest Overall (Auto)</option>
                <option value="fnv1a">FNV-1a</option>
                <option value="murmur3">MurmurHash3</option>
                <option value="djb2a">DJB2a</option>
            </select>
        </div>
        <div class="field-group">
            <label>Seeds Per Size</label>
            <input type="number" id="seedAttempts" value="1000">
        </div>
        <div class="field-group">
            <label>Output Prefix</label>
            <input type="text" id="enumPrefixInput" value="KW">
        </div>
    </div>

    <button id="genBtn" onclick="runOptimization()">Optimize Lookup Table</button>

    <div id="stats"></div>

    <div class="terminal">
        <div class="terminal-header">
            <span>KEYWORD_HASH_TABLE.H</span>
            <a href="javascript:void(0)" class="copy-btn" onclick="copyCode()">Copy Code</a>
        </div>
        <pre id="output">// Optimizer idle. Enter keywords and run...</pre>
    </div>
</div>

<script>
    const ALGORITHMS = {
        fnv1a: (str, seed) => {
            let h = 0x811c9dc5 ^ seed;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
        },
        murmur3: (str, seed) => {
            let h1 = seed ^ 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                let k1 = str.charCodeAt(i);
                k1 = Math.imul(k1, 0xcc9e2d51);
                k1 = (k1 << 15) | (k1 >>> 17);
                k1 = Math.imul(k1, 0x1b873593);
                h1 ^= k1;
                h1 = (h1 << 13) | (h1 >>> 19);
                h1 = Math.imul(h1, 5) + 0xe6546b64;
            }
            h1 ^= str.length;
            h1 ^= h1 >>> 16; h1 = Math.imul(h1, 0x85ebca6b);
            h1 ^= h1 >>> 13; h1 = Math.imul(h1, 0xc2b2ae35);
            h1 ^= h1 >>> 16;
            return h1 >>> 0;
        },
        djb2a: (str, seed) => {
            let h = 5381 ^ seed;
            for (let i = 0; i < str.length; i++) {
                h = ((h << 5) + h) ^ str.charCodeAt(i);
            }
            return h >>> 0;
        }
    };

    function getCppSource(algo, seed) {
        const s = "0x" + (seed >>> 0).toString(16).toUpperCase();
        if(algo === 'fnv1a') return `uint32_t hash(const char* str) {\n    uint32_t h = 0x811C9DC5 ^ ${s};\n    while (*str) { h ^= (uint8_t)*str++; h *= 0x01000193; }\n    return h;\n}`;
        if(algo === 'murmur3') return `uint32_t hash(const char* str) {\n    uint32_t h = ${s} ^ 0x811C9DC5; uint32_t len = 0;\n    while(str[len]) {\n        uint32_t k = (uint8_t)str[len++]; k *= 0xCC9E2D51; k = (k << 15) | (k >> 17); k *= 0x1B873593;\n        h ^= k; h = (h << 13) | (h >> 19); h = h * 5 + 0xE6546B64;\n    }\n    h ^= len; h ^= h >> 16; h *= 0x85EBCA6B; h ^= h >> 13; h *= 0xC2B2AE35; h ^= h >> 16;\n    return h;\n}`;
        if(algo === 'djb2a') return `uint32_t hash(const char* str) {\n    uint32_t h = 5381 ^ ${s};\n    while (*str) { h = ((h << 5) + h) ^ (uint8_t)*str++; }\n    return h;\n}`;
    }

    async function runOptimization() {
        const btn = document.getElementById('genBtn');
        const output = document.getElementById('output');
        const stats = document.getElementById('stats');
        const raw = document.getElementById('keywordsInput').value;
        const keywords = [...new Set(raw.split(/[,\s]+/).map(s => s.trim()).filter(s => s.length > 0))];
        const maxSeedAttempts = parseInt(document.getElementById('seedAttempts').value);
        const mode = document.getElementById('hashInput').value;

        btn.disabled = true;
        output.textContent = "// Searching for minimal perfect hash...";
        stats.style.display = "none";

        await new Promise(r => setTimeout(r, 60));

        const algosToTry = mode === "AUTO" ? Object.keys(ALGORITHMS) : [mode];
        let best = { size: Infinity, algo: '', seed: 0, table: [] };

        for (let size = keywords.length; size < keywords.length * 4; size++) {
            if (size >= best.size) break;
            for (const algoName of algosToTry) {
                const hashFn = ALGORITHMS[algoName];
                for (let attempt = 0; attempt < maxSeedAttempts; attempt++) {
                    const seed = (attempt === 0) ? 0x811C9DC5 : (Math.random() * 0xFFFFFFFF) >>> 0;
                    let table = Array(size).fill(null);
                    let collision = false;
                    for (let k = 0; k < keywords.length; k++) {
                        const h = hashFn(keywords[k], seed) % size;
                        if (table[h] !== null) { collision = true; break; }
                        table[h] = k;
                    }
                    if (!collision) {
                        best = { size, algo: algoName, seed, table: [...table] };
                        break;
                    }
                }
                if (best.size === size) break;
            }
        }

        if (best.size === Infinity) {
            output.textContent = "// Error: Search space exhausted.";
            btn.disabled = false;
            return;
        }

        const prefix = document.getElementById('enumPrefixInput').value;
        let code = '';
        keywords.forEach(kw => code += `const char* ${prefix}S_${kw.toUpperCase()} = "${kw}";\n`);
        code += `\nconst char* keywordStringTable[KW_COUNT] = {\n`;
        keywords.forEach(kw => code += `    ${prefix}S_${kw.toUpperCase()},\n`);
        code += `    ${prefix}_COUNT\n};\n\n`;
        code += `constexpr int ${prefix}_TABLE_SIZE = ${best.size};\n`;
        code += `constexpr std::array<int, ${prefix}_TABLE_SIZE> makeKeywordTable() {\n`;
        code += `    std::array<int, ${prefix}_TABLE_SIZE> table = {};\n\n`;
        best.table.forEach((idx, i) => {
            if (idx !== null) code += `    table[${i}] = ${prefix}_${keywords[idx].toUpperCase()};\n`;
        });
        code += `\n    return table;\n}\n\n`;
        code += `constexpr auto keywordTable = makeKeywordTable();\n\n`;
        code += getCppSource(best.algo, best.seed);

        output.textContent = code;
        stats.style.display = "block";
        stats.innerHTML = `✓ Found <strong>${best.algo}</strong> table | Size: <strong>${best.size}</strong> | Density: <strong>${((keywords.length/best.size)*100).toFixed(1)}%</strong> | Seed: <strong>0x${best.seed.toString(16).toUpperCase()}</strong>`;
        btn.disabled = false;
    }

    function copyCode() {
        const text = document.getElementById('output').textContent;
        navigator.clipboard.writeText(text);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => btn.textContent = "Copy Code", 2000);
    }
</script>

</body>
</html>
